server:
  port: ${SERVER_PORT}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

service:
  internal:
    api-key: ${INTERNAL_API_KEY}
  auth:
    url: ${AUTH_SERVICE_URL}