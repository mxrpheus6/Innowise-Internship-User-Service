spring:
  application:
    name: user-service

  liquibase:
    change-log: classpath:db/changelog/app-changelog.xml

  cache:
    type: redis

logging:
  level:
    liquibase: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info,metrics"

  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

  zipkin:
    tracing:
      endpoint: ${TEMPO_ZIPKIN}/api/v2/spans
  tracing:
    sampling:
      probability: 1.0